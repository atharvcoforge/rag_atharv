[project]
name = "ragpolicy"
version = "0.1.0"
description = "Span-grounded RAG over an employee expense policy, with calibrated abstention"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "numpy==2.2.1",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
]

[project.scripts]
rag = "ragpolicy.cli:main"

[dependency-groups]
dev = [
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
    "types-pyyaml==6.0.12.20241230",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpolicy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires a running Ollama or Postgres instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
