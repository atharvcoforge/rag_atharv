services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragpolicy-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragpolicy
    ports:
      # 5433 on the host so a local Postgres on 5432 keeps working.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragpolicy"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
